<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Menu</title>
</head>
<body style ="background-color: lightblue;">
<h1>Browsing Human and Vertebrate genome</h1>
<h2>Basic level services: </h2>

    <form action="myserver" method="get">
        <p>
        <h3>1) List of species in the genome database</h3>
        Limit: <input type="text" name="limit">
        <br><br>
        <input type="submit" name="list" value="Send">
        <br><br>
        <h3>2) Information about the karyotype</h3>
        <br><br>
        Select the species: <input type="text" name="species_karyotype">
        <br><br>
        <input type="submit" name="get_karyotype" value="Send">
        <br><br>
        <h3>3) Chromosome length</h3>
        <br>
        Select the species: <input type="text" name="species_chromosome_length">
        <br>
        Select a chromosome: <input type="text" name="chromosome_chromosome_length">
        <br><br>
        <input type="submit" name="chromosome_length" value="Send">
        <br><br>
        </p>
    </form>
</body>
</html>
