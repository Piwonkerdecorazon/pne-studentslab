<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Seq2 Server</title>
  </head>
  <body>
    <h1>Seq2 server</h1>

    <form action="myserver" method="get">
      Is the server alive? <input type="submit" name="ping" value="ping">
      <br><br>
      Get a sequence. Select the sequence number that you want:
      <select name="Seq number">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
        <input type="submit" name="get" value="get">
    </form>


  </body>
</html>
