<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Seq2 Server</title>
  </head>
  <body>
    <h1>Seq2 server</h1>

    <form action="myserver" method="get">
      Is the server alive? <input type="submit" name="ping" value="ping">
      <br><br>
      Get a sequence. Select the sequence number that you want:
      <select name="Seq number">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
        <input type="submit" name="get sequence" value="get sequence">
            <br><br>
      Get a sequence. Select the sequence number that you want:
      <select name="Gene">
        <option value="U5">U5</option>
        <option value="ADA">ADA</option>
        <option value="FRAT1">FRAT1</option>
        <option value="FXN">FXN</option>
        <option value="RNU6_269P">RNU6_269P</option>
      </select>
        <input type="submit" name="get gene" value="get gene">
      <br><br>
      Write a sequence: <input type="text" name="input seq">
      <br><br>
      Select an operation
      <input type="radio" name="info" value="info"> Info
      <input type="radio" name="complementary" value="Complementary"> Complementary
      <input type="radio" name="reverse" value="reverse"> Reverse
      <br><br>
      Perform an operation <input type="submit" name="operate" value="operate">
    </form>


  </body>
</html>
